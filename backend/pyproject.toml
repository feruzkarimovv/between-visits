[project]
name = "between-visits-backend"
version = "0.1.0"
description = "Between Visits backend: FastAPI + SQLModel, rules engine, interview engine, agent tools, webhooks"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "google-genai>=1.30",
  "twilio>=9.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "anthropic>=1.13.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["req(id): links a test to a requirement in validation/requirements.yaml"]
asyncio_mode = "auto"
