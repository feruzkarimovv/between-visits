# Bare `pytest` from the repository root runs the Site Signal statistics suite (WS5), for example
#   uv run --project monitoring pytest -q
# The backend suite keeps its own configuration in backend/pyproject.toml and runs from backend/
# (`make test-backend`, CI). pytest uses the configuration nearest to the paths it is given, so
# backend runs, and runs that name monitoring/tests/... explicitly, are unaffected by this file.
[pytest]
testpaths = monitoring/tests
