# Optional: `docker compose up` runs backend + frontend in demo mode without local toolchains.
services:
  backend:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app/backend
    command: sh -c "uv sync --frozen || uv sync; uv run python -m app.seed && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      DEMO_MODE: "${DEMO_MODE:-1}"
      DATABASE_URL: sqlite:///./backend/data/app.db
      CORS_ORIGINS: http://localhost:3000
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
      - backend-venv:/app/backend/.venv
      - backend-data:/app/backend/data
    ports: ["8000:8000"]
  frontend:
    image: node:22-bookworm-slim
    working_dir: /app/frontend
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    volumes:
      - .:/app
      - frontend-modules:/app/frontend/node_modules
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  backend-venv:
  backend-data:
  frontend-modules:
