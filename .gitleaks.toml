# gitleaks configuration (WS0 R1). Pinned release: Makefile GITLEAKS_VERSION, CI job `gitleaks`.
# Run: make secret-scan  (gitleaks over the full history of every ref, then validation/scan_numbers.py)
# Default rule set, plus three allowlists, each matched against the whole detected secret, so a real value that
# merely contains an allowlisted form is still reported: (1) the documented placeholders; (2) sha256 output digests,
# only in validation/site_signal/run_log.jsonl (path and digest must both match); (3) the app's own record IDs from
# backend/app/ids.py (a prefix such as sq_ plus 10 base32 characters), random identifiers of synthetic rows, not
# credentials. Nothing else is allowlisted: a real key, token or secret is rotated first and then removed, never added
# here. validation/secret-scan.md lists the false positives each entry covers.

title = "Between Visits"
minVersion = "v8.30.1"

[extend]
useDefault = true

[[allowlists]]
description = "Documented placeholders: +1XXXXXXXXXX, fictional +1555 numbers, change-me secrets, bv-change-me ntfy topics"
regexTarget = "secret"
regexes = [
  '''^\+1X{10}$''',
  '''^\+1555[0-9]{7}$''',
  '''^change-me[A-Za-z0-9_-]*$''',
  '''^bv-change-me[A-Za-z0-9_-]*$''',
]

[[allowlists]]
description = "sha256 output digests in the evaluation run log"
condition = "AND"
paths = ['''^validation/site_signal/run_log\.jsonl$''']
regexTarget = "secret"
regexes = ['''^[0-9a-f]{64}$''']

[[allowlists]]
description = "app IDs from app/ids.py"
regexTarget = "secret"
regexes = ['''^(sq|sr|ci|pat|ans|fnd|esc|dr|sae|aud)_[A-Z0-9]{10}$''']
