name: CI
on:
  push:
  pull_request:

# A newer push to the same ref cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1  # same pin as GITLEAKS_VERSION in the Makefile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks release binary (checksum-verified)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          dir="$RUNNER_TEMP/gitleaks" && mkdir -p "$dir" && cd "$dir"
          curl -fsSL --retry 3 -o "$tarball" "$base/$tarball"
          curl -fsSL --retry 3 -o "$sums" "$base/$sums"
          grep -E "^[0-9a-f]{64}  ${tarball}\$" "$sums" | sha256sum --check --strict -
          tar -xzf "$tarball"
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          test "$(gitleaks version)" = "$GITLEAKS_VERSION" || test "$(gitleaks version)" = "v$GITLEAKS_VERSION"
          gitleaks version
      - name: Secret scan (gitleaks full history + real-number grep)
        run: make secret-scan
      - name: Number scan self-test (scratch clone, generated non-555 numbers)
        run: python3 validation/scan_numbers.py --self-test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:  # build_traceability.py also runs the monitoring suite, whose REQ-022 test needs the history and the sap-v1 tag
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install (monitoring first; numpy and scipy live only there)
        run: |
          uv sync --project monitoring
          cd backend && uv sync
      - name: Lint
        run: cd backend && uv run ruff check app tests
      - name: Data validation
        run: uv run --project backend python data/validate_data.py
      - name: Agent sync script (offline)
        run: python3 agent/test_sync_agent.py
      - name: Recorded-scenario export whitelist (offline)
        run: python3 agent/test_export_scenario.py
      - name: Deployed agent config matches git (agent/deployed_snapshot.json, offline)
        run: python3 agent/check_config_hash.py
      - name: Tests (backend + monitoring suites) + requirement traceability
        run: uv run --project backend python validation/build_traceability.py --check

  # WS5 Site Signal statistics (monitoring/, its own uv project). Full history and tags: test_sap_order.py
  # (REQ-022) checks the sap-v1 tag, its ancestry and the evaluation seed and is never skipped in CI.
  # S7: the quick check of the committed validation (docs/11 §12) reproduces summary.json quick_hashes.
  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: cd monitoring && uv sync
      - name: Lint
        run: cd monitoring && uv run ruff check .
      - name: Tests
        run: cd monitoring && uv run pytest -q
      - name: Site Signal validation quick check (only once validation/site_signal/summary.json is committed)
        run: |
          if [ -f validation/site_signal/summary.json ]; then
            make site-signal-validate ARGS="--quick --check"
          else
            echo "::notice title=site-signal-validate skipped::validation/site_signal/summary.json is not committed yet; make site-signal-validate ARGS=\"--quick --check\" runs once it is"
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run typecheck
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run build

  # WS0 R9: the README quickstart on a clean runner, ending in a real replay through `make demo`
  # (DEMO_MODE=1: no external keys, fake LLM, console pager). make demo serves the API on :8000, the dashboard on :3000.
  quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      BV_API: http://localhost:8000
      BV_SCENARIO: rosa_es_urgent
      BV_REPLAY_SPEED: "4"     # ?speed=1|2|4 (docs/03 §6.2)
      BV_EXPECTED_DRAFTS: "3"  # Rosa's replay drafts one CM and two AE entries
      BV_WAIT_SECONDS: "120"
    steps:
      - uses: actions/checkout@v4
        with:  # make test includes the monitoring suite, whose REQ-022 test needs the history and the sap-v1 tag
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: cp .env.example .env
        run: cp .env.example .env
      - name: make setup
        run: make setup
      - name: make seed
        run: make seed
      - name: make test
        run: make test
      - name: make demo (background)
        run: |
          # Own session and process group: the recipe's `trap 'kill 0' EXIT` then reaches only the demo servers,
          # and the stop step below ends the whole group. Output goes to a file so this step returns at once.
          setsid make demo > "$RUNNER_TEMP/demo.log" 2>&1 < /dev/null &
          echo "$!" > "$RUNNER_TEMP/demo.pgid"
          echo "make demo started (process group $!)"
      - name: Wait for /api/health
        run: |
          set -euo pipefail
          deadline=$((SECONDS + BV_WAIT_SECONDS))
          until body=$(curl -fsS --max-time 3 "$BV_API/api/health" 2>/dev/null); do
            if (( SECONDS >= deadline )); then
              echo "::error::$BV_API/api/health did not answer within ${BV_WAIT_SECONDS} s"
              exit 1
            fi
            sleep 1
          done
          echo "health: $body"
          python3 -c 'import json, sys; sys.exit(0 if json.loads(sys.argv[1]).get("demo_mode") is True else "health: demo_mode is not true")' "$body"
      - name: Replay rosa_es_urgent and poll until its drafts arrive
        run: |
          set -euo pipefail
          resp=$(curl -fsS --max-time 10 -X POST "$BV_API/api/demo/replay/$BV_SCENARIO?speed=$BV_REPLAY_SPEED")
          echo "POST /api/demo/replay/$BV_SCENARIO?speed=$BV_REPLAY_SPEED -> $resp"
          id=$(python3 -c 'import json, sys; print(json.loads(sys.argv[1])["checkin_id"])' "$resp")
          start=$SECONDS
          deadline=$((start + BV_WAIT_SECONDS))
          status=unknown
          postcall=unknown
          n=0
          while :; do
            if body=$(curl -fsS --max-time 5 "$BV_API/api/checkins/$id" 2>/dev/null); then
              # CheckInDetail (docs/03): checkin.status, checkin.postcall_status (processing | done | failed), drafts[]
              read -r status postcall n < <(python3 -c 'import json, sys; d = json.loads(sys.argv[1]); c = d["checkin"]; print(c.get("status"), c.get("postcall_status"), len(d["drafts"]))' "$body")
              echo "t=$((SECONDS - start))s status=$status postcall=$postcall drafts=$n"
              if (( n == BV_EXPECTED_DRAFTS )); then
                echo "drafts=$n for $BV_SCENARIO (checkin $id, ?speed=$BV_REPLAY_SPEED, $((SECONDS - start)) s)"
                exit 0
              fi
              # The post-call pipeline writes its drafts and postcall_status=done together: done or failed is final.
              if (( n > BV_EXPECTED_DRAFTS )) || [ "$postcall" = done ] || [ "$postcall" = failed ]; then
                echo "::error::$BV_SCENARIO: drafts=$n (status=$status, postcall=$postcall), expected $BV_EXPECTED_DRAFTS"
                exit 1
              fi
            fi
            if (( SECONDS >= deadline )); then
              echo "::error::$BV_SCENARIO: drafts=$n (status=$status, postcall=$postcall) after ${BV_WAIT_SECONDS} s, expected $BV_EXPECTED_DRAFTS"
              exit 1
            fi
            sleep 2
          done
      - name: make demo log (on failure)
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/demo.log" || true
      - name: Stop make demo
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/demo.pgid" ]; then
            kill -TERM -- "-$(cat "$RUNNER_TEMP/demo.pgid")" 2>/dev/null || true
          fi

  # WS0 R10: Playwright smoke (e2e/, its own package.json and lockfile) against `make demo` on a fresh runner.
  # Journey 1: replay -> review confirm -> investigator -> SAE sign -> send -> sponsor inbox.
  # Journey 2: CRA drafts, edits and approves a site query at a Look/Watch site -> coordinator answers -> CRA closes
  # -> /audit shows the five site_query.* rows. DEMO_PROD=1 serves the production frontend build (no dev badge).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      BV_API: http://localhost:8000   # make demo's backend port
      BASE_URL: http://localhost:3000 # make demo's dashboard port; e2e/playwright.config.ts reads BASE_URL
      BV_WAIT_SECONDS: "300"          # next build + next start, then the seed and the API
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: cp .env.example .env
        run: cp .env.example .env
      - name: make setup
        run: make setup
      - name: Install the e2e suite and Chromium
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps chromium
      - name: make demo DEMO_PROD=1 (background)
        run: |
          # Own session and process group, as in the quickstart job: the stop step below ends the whole group.
          setsid make demo DEMO_PROD=1 > "$RUNNER_TEMP/demo.log" 2>&1 < /dev/null &
          echo "$!" > "$RUNNER_TEMP/demo.pgid"
          echo "make demo DEMO_PROD=1 started (process group $!)"
      - name: Wait for /api/health (demo mode) and the dashboard
        run: |
          set -euo pipefail
          deadline=$((SECONDS + BV_WAIT_SECONDS))
          until body=$(curl -fsS --max-time 3 "$BV_API/api/health" 2>/dev/null) && curl -fsS --max-time 10 -o /dev/null "$BASE_URL/"; do
            if (( SECONDS >= deadline )); then
              echo "::error::$BV_API/api/health or $BASE_URL/ did not answer within ${BV_WAIT_SECONDS} s"
              exit 1
            fi
            sleep 2
          done
          echo "health: $body"
          python3 -c 'import json, sys; sys.exit(0 if json.loads(sys.argv[1]).get("demo_mode") is True else "health: demo_mode is not true")' "$body"
      - name: Playwright smoke (both journeys)
        run: cd e2e && npx playwright test
      - name: Playwright report and traces (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: make demo log (on failure)
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/demo.log" || true
      - name: Stop make demo
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/demo.pgid" ]; then
            kill -TERM -- "-$(cat "$RUNNER_TEMP/demo.pgid")" 2>/dev/null || true
          fi
