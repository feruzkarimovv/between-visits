name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: cd backend && uv sync
      - name: Lint
        run: cd backend && uv run ruff check app tests
      - name: Data validation
        run: uv run --project backend python data/validate_data.py
      - name: Agent sync script (offline)
        run: python3 agent/test_sync_agent.py
      - name: Tests + requirement traceability
        run: uv run --project backend python validation/build_traceability.py --check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run typecheck
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run build
